### Core Setup

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# use bash history
set -g history-limit 10000
set -g mouse on

set-option -g default-command bash

## Prefix

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


### Keybindings

# reload tmux config with C-a r
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado!"

# create new windows in same directory
bind c new-window -c "#{pane_current_path}"

## Splits

# split panes using | and - also split panes in same directory
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

## Pane Navigation

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

## Copy Mode
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# disable "release mouse drag to copy and exit copy-mode"
unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key b copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward " "

### Styling

## Indexing

# start window index at 1
set -g base-index 1
# start pane index at 1
setw -g pane-base-index 1
# re-number and re-name windows dynamically
setw -g automatic-rename on
set -g renumber-windows on

## Status bar

# color status bar
set -g status-style "bg=#44475A,fg=#f8f8f2"

## Windows

# highlight current window
setw -g window-status-style "bg=#44475A,fg=#f8f8f2"
setw -g window-status-current-style "bg=#50fa7b,fg=#191A21"

## Panes

# set color of active pane
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#50fa7b"

## Highlights

# highlight window when it has new activity
setw -g monitor-activity on
set -g visual-activity on
